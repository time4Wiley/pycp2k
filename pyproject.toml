[project]
name = "pycp2k"
version = "0.2.1"
description = "A python interface to CP2K"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "future",
    "numpy",
    "ase",
]
authors = [
    {name = "Lauri Himanen", email = "lauri.himanen@gmail.com"}
]
license = {text = "MIT"}

[project.urls]
Homepage = "https://github.com/SINGROUP/pycp2k.git"
Repository = "https://github.com/SINGROUP/pycp2k.git"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pycp2k"]
