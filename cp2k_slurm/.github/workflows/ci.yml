name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev,cli]
    
    - name: Lint with ruff
      run: |
        ruff check cp2k_slurm/
    
    - name: Check formatting with black
      run: |
        black --check cp2k_slurm/
    
    - name: Type check with mypy
      run: |
        mypy cp2k_slurm/
    
    - name: Test with pytest (basic tests)
      run: |
        pytest tests/ -m "not slurm" --cov=cp2k_slurm --cov-report=xml
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml

  test-slurm:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/omnivector-solutions/slurm-docker-cluster:22.05
      options: --privileged
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      run: |
        apt-get update
        apt-get install -y python3 python3-pip python3-venv
        python3 -m pip install --upgrade pip
    
    - name: Install package
      run: |
        python3 -m pip install -e .[dev,cli]
    
    - name: Start SLURM services
      run: |
        /usr/local/bin/docker-entrypoint.sh &
        sleep 30
        sinfo
    
    - name: Test SLURM integration
      run: |
        pytest tests/ -m "slurm" -v

  build:
    runs-on: ubuntu-latest
    needs: [test]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    
    - name: Build package
      run: |
        python -m build
    
    - name: Check package
      run: |
        twine check dist/*
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: dist
        path: dist/ 